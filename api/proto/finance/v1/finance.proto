// Service contracts shared by the Go and Rust services and by the Flutter
// client. Generate stubs with scripts/gen-proto.sh.
syntax = "proto3";

package finance.v1;

option go_package = "github.com/finance-tracker/api/gen/finance/v1;financev1";

// Auth issues and validates access tokens.
service Auth {
  rpc Register(RegisterRequest) returns (User);
  rpc Login(LoginRequest) returns (TokenResponse);
  rpc Validate(ValidateRequest) returns (Claims);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message TokenResponse {
  string access_token = 1;
  string token_type = 2;
  int32 expires_in = 3;
}

message ValidateRequest {
  string access_token = 1;
}

message Claims {
  string subject = 1;
  string email = 2;
  int64 expires_at = 3;
}

message User {
  string id = 1;
  string email = 2;
}

// Users owns profile data.
service Users {
  rpc GetProfile(GetProfileRequest) returns (Profile);
  rpc UpdateProfile(Profile) returns (Profile);
}

message GetProfileRequest {
  string user_id = 1;
}

message Profile {
  string user_id = 1;
  string name = 2;
  // ISO 4217 code, e.g. "USD".
  string currency = 3;
}

// Ai classifies transactions.
service Ai {
  rpc Classify(ClassifyRequest) returns (ClassifyResponse);
}

message ClassifyRequest {
  string description = 1;
  int64 amount_cents = 2;
}

message ClassifyResponse {
  string category = 1;
  float confidence = 2;
}

// Media inspects and transforms uploads.
service Media {
  rpc Inspect(InspectRequest) returns (InspectResponse);
}

message InspectRequest {
  bytes content = 1;
}

message InspectResponse {
  string format = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint64 bytes = 4;
}
