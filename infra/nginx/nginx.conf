# Edge proxy: TLS termination, upload limits and client IP forwarding.
# Everything below /api goes to the Go gateway, which owns routing from there.

upstream gateway {
    server gateway:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Media uploads go through this hop; raise with the media service's limit.
    client_max_body_size 32m;

    # Mobile clients on cellular links need room before the proxy gives up.
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location /healthz {
        proxy_pass http://gateway/healthz;
    }

    location /api/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Deny everything not explicitly routed above.
    location / {
        return 404;
    }
}
